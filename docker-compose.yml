services:
  mcp:
    build:
      context: .
      dockerfile: docker/mcp/Dockerfile
    container_name: mcp_server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY:-}
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      REDMINE_BASE_URL: ${REDMINE_BASE_URL}
      REDMINE_API_KEY: ${REDMINE_API_KEY:-}
      REDMINE_USERNAME: ${REDMINE_USERNAME:-}
      REDMINE_PASSWORD: ${REDMINE_PASSWORD:-}
      REDMINE_DEFAULT_USER_ID: ${REDMINE_DEFAULT_USER_ID:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
