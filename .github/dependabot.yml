version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Development tooling (rector, phpstan, larastan, pest) is version-sensitive
    # and intentionally left out of the group: a single blocked bump would hold
    # up the rest.
    groups:
      runtime-minor-patch:
        dependency-type: production
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
